name: Deploy Site

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Debug Secret Exists
        run: |
          if [ -z "${{ secrets.GOOGLE_MAPS_API_KEY }}" ]; then
            echo "SECRET IS MISSING"
            exit 1
          else
            echo "SECRET FOUND"
          fi

      - name: Inject API Key
        run: |
          python3 - <<EOF
          from pathlib import Path

          key = "${{ secrets.GOOGLE_MAPS_API_KEY }}"

          path = Path("index.html")

          content = path.read_text()

          content = content.replace("__API_KEY__", key)

          path.write_text(content)
          EOF

      - name: Debug Key Prefix
        run: |
          echo "${{ secrets.GOOGLE_MAPS_API_KEY }}" | cut -c1-6

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .